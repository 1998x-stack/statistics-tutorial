<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">第 24 章：真实数据分析实战 核心概念图</title><desc id="fig-desc">分析流程不是从模型开始，而是从可回答的问题和可信的数据开始。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#54736f"/></marker></defs><rect width="840" height="300" rx="22" fill="#f5f8f6"/><rect x="25" y="105" width="140" height="75" rx="13" fill="#e7e5ff" stroke="#8fb9af" stroke-width="1.5"/><text x="95" y="148.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">问题</text><path d="M165 142 L190 142" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="190" y="105" width="140" height="75" rx="13" fill="#dcefeb" stroke="#8fb9af" stroke-width="1.5"/><text x="260" y="148.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">数据审计</text><path d="M330 142 L355 142" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="355" y="105" width="120" height="75" rx="13" fill="#fff0d8" stroke="#8fb9af" stroke-width="1.5"/><text x="415" y="148.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">EDA</text><path d="M475 142 L500 142" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="500" y="105" width="130" height="75" rx="13" fill="#dcefeb" stroke="#8fb9af" stroke-width="1.5"/><text x="565" y="148.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">建模</text><path d="M630 142 L655 142" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="655" y="105" width="160" height="75" rx="13" fill="#e7e5ff" stroke="#8fb9af" stroke-width="1.5"/><text x="735" y="148.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">沟通</text><text x="420" y="240" text-anchor="middle" font-size="16" fill="#526765" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">先确认数据与问题，再选择分析方法</text></svg>