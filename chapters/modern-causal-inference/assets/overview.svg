<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">第 27 章：现代因果推断 核心概念图</title><desc id="fig-desc">四种方法依赖不同的准实验结构；不能只凭方法名称就认定因果识别成立。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#54736f"/></marker></defs><rect width="840" height="300" rx="22" fill="#f5f8f6"/><rect x="35" y="45" width="350" height="90" rx="13" fill="#e7e5ff" stroke="#8fb9af" stroke-width="1.5"/><text x="210" y="96" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">PSM · 倾向得分匹配</text><rect x="455" y="45" width="350" height="90" rx="13" fill="#dcefeb" stroke="#8fb9af" stroke-width="1.5"/><text x="630" y="96" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">DID · 双重差分</text><rect x="35" y="165" width="350" height="90" rx="13" fill="#fff0d8" stroke="#8fb9af" stroke-width="1.5"/><text x="210" y="216" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">RDD · 断点回归</text><rect x="455" y="165" width="350" height="90" rx="13" fill="#fce6e3" stroke="#8fb9af" stroke-width="1.5"/><text x="630" y="216" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">IV · 工具变量</text><text x="420" y="285" text-anchor="middle" font-size="16" fill="#526765" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">方法选择来自研究设计结构，而不是工具偏好</text></svg>