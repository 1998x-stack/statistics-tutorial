<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">第 23 章：统计学工具链 核心概念图</title><desc id="fig-desc">工具链是分工协作的流水线；统计判断仍需由研究问题和模型假设驱动。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#54736f"/></marker></defs><rect width="840" height="300" rx="22" fill="#f5f8f6"/><rect x="25" y="105" width="130" height="75" rx="13" fill="#e7e5ff" stroke="#8fb9af" stroke-width="1.5"/><text x="90" y="148.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">数据</text><path d="M155 142 L180 142" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="180" y="105" width="130" height="75" rx="13" fill="#dcefeb" stroke="#8fb9af" stroke-width="1.5"/><text x="245" y="148.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">整理</text><path d="M310 142 L335 142" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="335" y="105" width="155" height="75" rx="13" fill="#fff0d8" stroke="#8fb9af" stroke-width="1.5"/><text x="412.5" y="148.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">统计计算</text><path d="M490 142 L515 142" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="515" y="105" width="130" height="75" rx="13" fill="#dcefeb" stroke="#8fb9af" stroke-width="1.5"/><text x="580" y="148.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">建模</text><path d="M645 142 L670 142" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="670" y="105" width="145" height="75" rx="13" fill="#e7e5ff" stroke="#8fb9af" stroke-width="1.5"/><text x="742.5" y="148.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">报告</text><text x="420" y="240" text-anchor="middle" font-size="16" fill="#526765" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">工具负责执行，分析者负责判断假设与解释边界</text></svg>