<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">第 14 章：简单线性回归 核心概念图</title><desc id="fig-desc">回归线概括条件均值趋势；每个观测值与拟合值之间的差是残差。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#54736f"/></marker></defs><rect width="840" height="300" rx="22" fill="#f5f8f6"/><path d="M80 235 H770 M100 250 V40" stroke="#738985" stroke-width="2"/><path d="M140 215 L700 65" stroke="#0f766e" stroke-width="4"/><circle cx="170" cy="190" r="6" fill="#6d5bd0"/><circle cx="245" cy="170" r="6" fill="#6d5bd0"/><circle cx="300" cy="150" r="6" fill="#6d5bd0"/><circle cx="370" cy="145" r="6" fill="#6d5bd0"/><circle cx="440" cy="115" r="6" fill="#6d5bd0"/><circle cx="515" cy="125" r="6" fill="#6d5bd0"/><circle cx="600" cy="85" r="6" fill="#6d5bd0"/><circle cx="680" cy="100" r="6" fill="#6d5bd0"/><path d="M515 125 V115" stroke="#d97706" stroke-width="3" stroke-dasharray="4 4"/><text x="600" y="45" text-anchor="middle" font-size="16" fill="#0f766e" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">拟合直线</text><text x="555" y="150" text-anchor="middle" font-size="15" fill="#b45309" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">残差</text><text x="420" y="280" text-anchor="middle" font-size="16" fill="#526765" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">残差 = 观测值 − 拟合值</text></svg>