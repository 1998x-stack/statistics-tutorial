<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">第 16 章：多重比较与谬误 核心概念图</title><desc id="fig-desc">单次检验的 α 不等于一组检验整体至少出现一次假阳性的概率。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#54736f"/></marker></defs><rect width="840" height="300" rx="22" fill="#f5f8f6"/><rect x="45" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="87" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="129" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="171" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="213" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="255" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="297" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="339" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="381" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="423" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="465" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="507" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="549" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="591" y="95" width="25" height="115" rx="4" fill="#d97706"/><rect x="633" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="675" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="717" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><rect x="759" y="160" width="25" height="50" rx="4" fill="#7bb5a8"/><path d="M35 215 H805" stroke="#738985" stroke-width="2"/><text x="420" y="55" text-anchor="middle" font-size="18" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">单次检验 α = 0.05</text><text x="420" y="260" text-anchor="middle" font-size="16" fill="#526765" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">检验次数增加，整体至