<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">第 22 章：贝叶斯统计入门 核心概念图</title><desc id="fig-desc">同一份数据会结合不同先验产生不同后验；应检查先验影响与模型假设。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#54736f"/></marker></defs><rect width="840" height="300" rx="22" fill="#f5f8f6"/><path d="M70 235 H780" stroke="#738985" stroke-width="2"/><path d="M90 235 C170 235 200 100 300 100 C400 100 420 235 500 235" fill="none" stroke="#6d5bd0" stroke-width="4"/><path d="M240 235 C320 235 350 65 455 65 C560 65 580 235 660 235" fill="none" stroke="#d97706" stroke-width="4"/><path d="M330 235 C410 235 440 45 545 45 C650 45 680 235 760 235" fill="none" stroke="#0f766e" stroke-width="4"/><text x="290" y="80" text-anchor="middle" font-size="16" fill="#6d5bd0" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">先验</text><text x="455" y="45" text-anchor="middle" font-size="16" fill="#a85b18" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">似然</text><text x="570" y="25" text-anchor="middle" font-size="16" fill="#0f766e" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">后验</text><text x="420" y="275" text-anchor="middle" font-size="16" fill="#526765" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">数据到来后，先验与似然共同形成后验</text></svg>