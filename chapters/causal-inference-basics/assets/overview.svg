<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">第 17 章：因果推断基础 核心概念图</title><desc id="fig-desc">混杂变量同时影响处理分配和结果，可能制造或扭曲处理与结果的观察关联。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#54736f"/></marker></defs><rect width="840" height="300" rx="22" fill="#f5f8f6"/><circle cx="420" cy="65" r="45" fill="#fff0d8" stroke="#d08a3d" stroke-width="3"/><circle cx="230" cy="220" r="45" fill="#dcefeb" stroke="#0f766e" stroke-width="3"/><circle cx="610" cy="220" r="45" fill="#e7e5ff" stroke="#6d5bd0" stroke-width="3"/><path d="M390 100 L260 180 M450 100 L580 180 M275 220 H565" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><text x="420" y="72" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">混杂 C</text><text x="230" y="226" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">处理 T</text><text x="610" y="226" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">结果 Y</text><text x="420" y="285" text-anchor="middle" font-size="16" fill="#526765" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">C 同时影响 T 与 Y，形成混杂路径</text></svg>