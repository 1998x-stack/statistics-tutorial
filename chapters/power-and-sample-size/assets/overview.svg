<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">第 12 章：统计功效与样本量 核心概念图</title><desc id="fig-desc">两种分布重叠的区域体现检验的错误风险；效应量或样本量会改变重叠程度。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#54736f"/></marker></defs><rect width="840" height="300" rx="22" fill="#f5f8f6"/><path d="M70 230 H780" stroke="#738985" stroke-width="2"/><path d="M80 230 C150 230 175 80 285 80 C395 80 420 230 490 230" fill="none" stroke="#0f766e" stroke-width="4"/><path d="M260 230 C330 230 355 80 465 80 C575 80 600 230 670 230" fill="none" stroke="#6d5bd0" stroke-width="4"/><rect x="600" y="80" width="170" height="150" fill="#f7d8bd" opacity=".4"/><text x="275" y="55" text-anchor="middle" font-size="17" fill="#0f766e" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">H₀</text><text x="465" y="55" text-anchor="middle" font-size="17" fill="#6d5bd0" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">H₁</text><text x="685" y="120" text-anchor="middle" font-size="24" fill="#b45309" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">β</text><text x="420" y="275" text-anchor="middle" font-size="16" fill="#526765" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">分布重叠越少，区分两种状态通常越容易</text></svg>