<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">第 01 章：什么是统计学 核心概念图</title><desc id="fig-desc">统计学习的基本路径：先明确要研究的总体，再通过样本形成有边界的结论。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#54736f"/></marker></defs><rect width="840" height="300" rx="22" fill="#f5f8f6"/><rect x="35" y="100" width="160" height="78" rx="13" fill="#e7e5ff" stroke="#8fb9af" stroke-width="1.5"/><text x="115" y="145" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">研究问题</text><path d="M195 139 L235 139" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="235" y="100" width="150" height="78" rx="13" fill="#dcefeb" stroke="#8fb9af" stroke-width="1.5"/><text x="310" y="145" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">总体</text><path d="M385 139 L425 139" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="425" y="100" width="150" height="78" rx="13" fill="#fff0d8" stroke="#8fb9af" stroke-width="1.5"/><text x="500" y="145" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">样本</text><path d="M575 139 L615 139" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="615" y="100" width="185" height="78" rx="13" fill="#e7e5ff" stroke="#8fb9af" stroke-width="1.5"/><text x="707.5" y="145" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">结论</text><text x="420" y="230" text-anchor="middle" font-size="16" fill="#526765" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">抽样带来不确定性；推断结论需要报告边界</text></svg>