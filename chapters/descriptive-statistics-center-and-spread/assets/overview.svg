<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">第 03 章：描述统计（一） 核心概念图</title><desc id="fig-desc">极端高值会明显拉高均值，但中位数仍落在典型观测附近。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#54736f"/></marker></defs><rect width="840" height="300" rx="22" fill="#f5f8f6"/><path d="M80 205 H770" stroke="#738985" stroke-width="2"/><circle cx="115" cy="170" r="8" fill="#0f766e"/><circle cx="210" cy="170" r="8" fill="#0f766e"/><circle cx="300" cy="170" r="8" fill="#0f766e"/><circle cx="390" cy="170" r="8" fill="#0f766e"/><circle cx="720" cy="170" r="8" fill="#d97706"/><path d="M115 150 V220 M210 150 V220 M300 150 V220 M390 150 V220 M720 150 V220" stroke="#c1cfca" stroke-dasharray="4 5"/><text x="300" y="100" text-anchor="middle" font-size="18" fill="#0f766e" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">中位数附近</text><text x="535" y="70" text-anchor="middle" font-size="18" fill="#b45309" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">均值被极端值拉向右侧</text><text x="115" y="245" text-anchor="middle" font-size="15" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">15</text><text x="210" y="245" text-anchor="middle" font-size="15" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">18</text><text x="300" y="245" text-anchor="middle" font-size="15" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">20</text><text x="390" y="245" text-anchor="middle" font-size="15" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">22</text><text x="720" y="245" text-anchor="middle" font-size="15" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">200</text><path d="M300 112 V150" stroke="#0f766e" stroke-width="3"/></svg>