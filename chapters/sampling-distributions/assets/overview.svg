<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">第 08 章：抽样与抽样分布 核心概念图</title><desc id="fig-desc">从同一总体反复抽样，会得到一组不同的样本统计量；这些统计量构成抽样分布。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#54736f"/></marker></defs><rect width="840" height="300" rx="22" fill="#f5f8f6"/><rect x="35" y="95" width="150" height="85" rx="13" fill="#e7e5ff" stroke="#8fb9af" stroke-width="1.5"/><text x="110" y="143.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">总体</text><path d="M185 137 L260 137" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="260" y="95" width="160" height="85" rx="13" fill="#dcefeb" stroke="#8fb9af" stroke-width="1.5"/><text x="340" y="143.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">重复抽样</text><path d="M420 137 L495 137" stroke="#54736f" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="495" y="95" width="145" height="85" rx="13" fill="#fff0d8" stroke="#8fb9af" stroke-width="1.5"/><text x="567.5" y="143.5" text-anchor="middle" font-size="17" fill="#243b3a" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">统计量</text><path d="M650 190 C690 190 700 75 745 75 C790 75 800 190 820 190" fill="none" stroke="#6d5bd0" stroke-width="4"/><text x="735" y="220" text-anchor="middle" font-size="16" fill="#6d5bd0" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">抽样分布</text></svg>