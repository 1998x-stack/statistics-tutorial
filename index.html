<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>课程目录</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f9fcf5 0%, #e8f3e8 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            padding: 2rem 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            display: block;
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(2px);
            border-radius: 48px 48px 32px 32px;
            padding: 2rem 2rem 1.5rem;
            box-shadow: 0 20px 40px rgba(90, 140, 100, 0.15), 0 8px 20px rgba(0, 30, 20, 0.08);
            border: 1px solid rgba(255, 245, 200, 0.5);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 2rem;
            border-bottom: 4px solid #f7d44a;
            padding-bottom: 0.75rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #2b7a4b, #3f9e6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 8px rgba(60, 140, 80, 0.12);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1 .emoji {
            font-size: 2.2rem;
            filter: drop-shadow(0 2px 4px rgba(255, 200, 50, 0.3));
        }

        .header .sub {
            font-size: 1rem;
            background: #fef7e0;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            color: #3f6b4a;
            font-weight: 600;
            border: 1px solid #f3d98a;
            box-shadow: 0 2px 6px rgba(200, 160, 50, 0.1);
            white-space: nowrap;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
            margin: 1.8rem 0 1.2rem;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 1rem 1.2rem 1rem 1.2rem;
            box-shadow: 0 6px 14px rgba(70, 120, 80, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            border: 1px solid rgba(210, 230, 200, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(2px);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 24px rgba(70, 140, 90, 0.15), 0 4px 12px rgba(40, 100, 60, 0.05);
            border-color: #b8d9b0;
            background: #fefefc;
        }

        .card-header {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            margin-bottom: 0.4rem;
            flex-wrap: wrap;
        }

        .chapter-num {
            font-size: 1.1rem;
            font-weight: 700;
            background: #f5d142;
            color: #2a5a3a;
            padding: 0 0.6rem;
            border-radius: 40px;
            line-height: 1.6;
            display: inline-block;
            box-shadow: inset 0 -2px 0 #dbb42c;
            letter-spacing: 0.3px;
            min-width: 2.2rem;
            text-align: center;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 650;
            color: #1f4d33;
            letter-spacing: -0.3px;
            line-height: 1.3;
            flex: 1;
        }

        .topic-list {
            list-style: none;
            margin-top: 0.3rem;
            padding-left: 0.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem 0.6rem;
        }

        .topic-list li {
            font-size: 0.8rem;
            color: #2d543a;
            background: #f1f9ee;
            padding: 0.1rem 0.7rem 0.2rem 1.2rem;
            border-radius: 30px;
            line-height: 1.6;
            position: relative;
            border: 1px solid #dcebd4;
            box-shadow: inset 0 1px 2px white;
        }

        .topic-list li::before {
            content: "⚡";
            position: absolute;
            left: 4px;
            top: 0px;
            font-size: 0.7rem;
            color: #e5b13b;
        }

        .card-footer {
            margin-top: 0.6rem;
            display: flex;
            justify-content: flex-end;
            border-top: 1px dashed #d4e8d0;
            padding-top: 0.5rem;
        }

        .card-footer a {
            background: #b7d8b0;
            color: #1f452b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            transition: 0.15s;
            border: 1px solid #8fb88a;
            box-shadow: 0 2px 4px rgba(60, 120, 60, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .card-footer a::after {
            content: "→";
            font-size: 1rem;
            transition: transform 0.1s;
        }

        .card-footer a:hover {
            background: #f7d44a;
            border-color: #dbb42c;
            color: #1f3d28;
            box-shadow: 0 4px 8px rgba(200, 160, 40, 0.2);
            transform: scale(1.02);
        }

        .card-footer a:active {
            transform: scale(0.96);
        }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 1rem;
            color: #3b6b47;
            background: #f2fcee;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            display: inline-block;
            border: 1px solid #c6dfbe;
            box-shadow: 0 2px 8px rgba(80, 130, 70, 0.08);
            font-weight: 500;
            letter-spacing: 0.3px;
            backdrop-filter: blur(2px);
        }

        .footer span {
            background: #f9eec1;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            margin: 0 4px;
        }

        .footer .wechat {
            font-weight: 700;
            color: #1f5a33;
        }

        @media (max-width: 640px) {
            body { padding: 1rem 0.8rem; }
            .container { padding: 1.2rem 1rem; border-radius: 32px; }
            .header h1 { font-size: 1.8rem; }
            .header .sub { font-size: 0.75rem; padding: 0.2rem 0.8rem; }
            .course-grid { grid-template-columns: 1fr; gap: 1rem; }
            .card-title { font-size: 1.05rem; }
            .topic-list li { font-size: 0.7rem; }
        }

        @media (min-width: 768px) and (max-width: 1024px) {
            .course-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .container::before {
            content: "";
            display: block;
            height: 6px;
            width: 120px;
            background: linear-gradient(90deg, #f7d44a, #7fc47c, #4aa0b0, #f7b07a);
            border-radius: 10px;
            margin-bottom: 0.2rem;
        }

        /* Alternate chapter badge colors */
        .card:nth-child(6n+1) .chapter-num { background: #f7b07a; color: #3d2e1a; }
        .card:nth-child(6n+2) .chapter-num { background: #a7d4a0; color: #1f452b; }
        .card:nth-child(6n+3) .chapter-num { background: #f5d44a; color: #2f4d2a; }
        .card:nth-child(6n+4) .chapter-num { background: #b3d9e8; color: #1a3f4a; }
        .card:nth-child(6n+5) .chapter-num { background: #f7c6c6; color: #5a2e2e; }
        .card:nth-child(6n) .chapter-num { background: #c4b3e0; color: #2f2a4a; }

        .state-msg {
            text-align: center;
            padding: 3rem;
            color: #5f7f66;
            font-size: 1.1rem;
        }
        .state-msg.error {
            color: #b91c1c;
            background: #fef2f2;
            border-radius: 20px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><span class="emoji"></span><span class="title-text"></span></h1>
        <div class="sub"></div>
    </div>

    <div id="cardContainer" class="course-grid"></div>

    <div style="text-align:center;">
        <div class="footer"></div>
    </div>
</div>

<script>
    (function() {
        var container = document.getElementById('cardContainer');
        var emojiEl = document.querySelector('.header .emoji');
        var titleEl = document.querySelector('.header .title-text');
        var subEl = document.querySelector('.header .sub');
        var footerEl = document.querySelector('.footer');

        function showError(msg) {
            container.innerHTML = '<div class="state-msg error">' + msg + '</div>';
        }

        // Local file:// pages cannot reliably fetch JSON due to browser origin restrictions.
        // Keep an embedded snapshot for offline reading; hosted pages still fetch courses.json.
        var offlineCourses = {"title":"统计学 · 从入门到精通","emoji":"📊","subtitle":"📘 28章 实战体系","chapterCount":28,"chapters":[{"num":"01","title":"什么是统计学","topics":["统计学的定义","描述vs推断","总体与样本","变量类型"],"file":"01.html"},{"num":"02","title":"数据的类型与来源","topics":["定性vs定量","离散vs连续","横截面vs时间序列","抽样方法"],"file":"02.html"},{"num":"03","title":"描述统计（一）","topics":["均值","中位数","众数","方差与标准差"],"file":"03.html"},{"num":"04","title":"描述统计（二）","topics":["百分位数","箱线图","偏度与峰度","数据标准化"],"file":"04.html"},{"num":"05","title":"数据可视化基础","topics":["直方图","散点图","条形图","可视化误区"],"file":"05.html"},{"num":"06","title":"概率基础","topics":["古典概率","条件概率","贝叶斯公式","随机变量"],"file":"06.html"},{"num":"07","title":"常见概率分布","topics":["二项分布","泊松分布","正态分布","中心极限定理"],"file":"07.html"},{"num":"08","title":"抽样与抽样分布","topics":["简单随机抽样","分层抽样","抽样分布","标准误"],"file":"08.html"},{"num":"09","title":"点估计与区间估计","topics":["矩估计","最大似然","置信区间","误差边界"],"file":"09.html"},{"num":"10","title":"假设检验入门","topics":["零假设","备择假设","p值","显著性水平"],"file":"10.html"},{"num":"11","title":"常见假设检验","topics":["z检验","t检验","卡方检验","F检验"],"file":"11.html"},{"num":"12","title":"统计功效与样本量","topics":["Type I/II错误","功效分析","效应量","样本量计算"],"file":"12.html"},{"num":"13","title":"相关分析","topics":["Pearson相关","Spearman相关","相关矩阵","相关≠因果"],"file":"13.html"},{"num":"14","title":"简单线性回归","topics":["最小二乘法","R²","残差分析","回归诊断"],"file":"14.html"},{"num":"15","title":"p值与显著性危机","topics":["p-hacking","HARKing","文件抽屉问题","可重复性危机"],"file":"15.html"},{"num":"16","title":"多重比较与谬误","topics":["Bonferroni校正","FDR","辛普森悖论","幸存者偏差"],"file":"16.html"},{"num":"17","title":"因果推断基础","topics":["混杂变量","工具变量","DAG","RCT"],"file":"17.html"},{"num":"18","title":"统计伦理与最佳实践","topics":["数据造假","选择性报告","预注册","开放科学"],"file":"18.html"},{"num":"19","title":"多元线性回归","topics":["多元回归","共线性","交互项","AIC/BIC"],"file":"19.html"},{"num":"20","title":"逻辑回归","topics":["odds与logit","二分类","ROC曲线","混淆矩阵"],"file":"20.html"},{"num":"21","title":"方差分析（ANOVA）","topics":["单因素ANOVA","双因素ANOVA","交互效应","事后检验"],"file":"21.html"},{"num":"22","title":"贝叶斯统计入门","topics":["先验与后验","MCMC","贝叶斯vs频率学派","AI时代的贝叶斯"],"file":"22.html"},{"num":"23","title":"统计学工具链","topics":["Python scipy.stats","statsmodels","R基础","Jupyter"],"file":"23.html"},{"num":"24","title":"真实数据分析实战","topics":["数据清洗","EDA","建模","报告全流程"],"file":"24.html"},{"num":"25","title":"A/B测试实战","topics":["实验设计","样本量计算","显著性检验","决策规则"],"file":"25.html"},{"num":"26","title":"机器学习中的统计学","topics":["偏差-方差权衡","正则化","交叉验证","贝叶斯优化"],"file":"26.html"},{"num":"27","title":"现代因果推断","topics":["倾向得分匹配","DID","断点回归","工具变量"],"file":"27.html"},{"num":"28","title":"综合项目：从问题到结论","topics":["选题","研究设计","数据分析","报告撰写"],"file":"28.html"}]};
        var coursesRequest = location.protocol === 'file:'
            ? Promise.resolve(offlineCourses)
            : fetch('courses.json').then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            });

        coursesRequest
            .then(function(data) {
                document.title = data.title + ' · 课程目录';
                emojiEl.textContent = data.emoji;
                titleEl.textContent = data.title;
                subEl.textContent = data.subtitle;
                footerEl.innerHTML = '<span>' + data.chapterCount + '章</span> 实战体系 · 从入门到精通';

                if (!data.chapters || data.chapters.length === 0) {
                    showError('暂无课程数据');
                    return;
                }

                container.innerHTML = '';
                data.chapters.forEach(function(course) {
                    var card = document.createElement('div');
                    card.className = 'card';

                    var headerDiv = document.createElement('div');
                    headerDiv.className = 'card-header';

                    var numSpan = document.createElement('span');
                    numSpan.className = 'chapter-num';
                    numSpan.textContent = course.num;

                    var titleSpan = document.createElement('span');
                    titleSpan.className = 'card-title';
                    titleSpan.textContent = course.title;

                    headerDiv.appendChild(numSpan);
                    headerDiv.appendChild(titleSpan);
                    card.appendChild(headerDiv);

                    if (course.topics && course.topics.length > 0) {
                        var topicUl = document.createElement('ul');
                        topicUl.className = 'topic-list';
                        course.topics.forEach(function(topic) {
                            var li = document.createElement('li');
                            li.textContent = topic;
                            topicUl.appendChild(li);
                        });
                        card.appendChild(topicUl);
                    }

                    var footerDiv = document.createElement('div');
                    footerDiv.className = 'card-footer';
                    var link = document.createElement('a');
                    link.href = course.file;
                    link.textContent = '开始学习 ';
                    footerDiv.appendChild(link);
                    card.appendChild(footerDiv);

                    container.appendChild(card);
                });
            })
            .catch(function(err) {
                showError('课程数据加载失败: ' + err.message + '。请刷新页面重试。');
            });
    })();
</script>

<noscript>
    <div style="background:#fcf0d9; padding:1rem; border-radius:20px; text-align:center; color:#92400e;">
        请启用 JavaScript 以浏览课程目录。
    </div>
</noscript>
</body>
</html>
