name: Static content QA
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog, links and worked examples
        run: |
          node tests/offline-catalog.test.cjs
          node tests/site.test.cjs
          node tests/examples.test.cjs
      - name: Parse standalone SVG and accessibility metadata
        run: python3 tests/validate_svg.py
