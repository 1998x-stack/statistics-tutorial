<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">条形图零基线对长度感知的影响</title><desc id="d">两组类别指标为62和68。左图从0绘制条形长度为62和68，右图只显示60到70的截断区间使可见长度为2和8，可能夸大视觉比例。</desc><rect width="900" height="380" rx="16" fill="#fff"/><g font-family="system-ui, sans-serif">
<text x="35" y="43" font-size="20" font-weight="750" fill="#294b50">同一组数据，柱子的“可见长度”讲了不同故事</text>
<rect x="36" y="75" width="397" height="252" rx="12" fill="#f7faf8" stroke="#dce7e3"/><text x="52" y="109" font-size="16" font-weight="750" fill="#147f80">从 0 开始</text><text x="53" y="160" font-size="13" fill="#31575a">A = 62</text><text x="53" y="236" font-size="13" fill="#31575a">B = 68</text><rect x="118" y="139" width="236.48571428571427" height="28" rx="4" fill="#147f80"/><rect x="118" y="215" width="259.37142857142857" height="28" rx="4" fill="#c06d4c"/><line x1="118" y1="279" x2="385" y2="279" stroke="#8aa6a3"/><text x="118" y="302" font-size="12" fill="#597377" text-anchor="middle">0</text><text x="385" y="302" font-size="12" fill="#597377" text-anchor="middle">70</text></rect><rect x="466" y="75" width="397" height="252" rx="12" fill="#f7faf8" stroke="#dce7e3"/><text x="482" y="109" font-size="16" font-weight="750" fill="#c06d4c">从 60 开始（截断）</text><text x="483" y="160" font-size="13" fill="#31575a">A = 62</text><text x="483" y="236" font-size="13" fill="#31575a">B = 68</text><rect x="548" y="139" width="53.400000000000006" height="28" rx="4" fill="#147f80"/><rect x="548" y="215" width="213.60000000000002" height="28" rx="4" fill="#c06d4c"/><line x1="548" y1="279" x2="815" y2="279" stroke="#8aa6a3"/><text x="548" y="302" font-size="12" fill="#597377" text-anchor="middle">60</text><text x="815" y="302" font-size="12" fill="#597377" text-anchor="middle">70</text></rect>
<text x="38" y="359" font-size="12" fill="#557277">类别柱长用于比较绝对量时，应避免隐藏零基线；折线图或明确差值图则需要按任务具体判断。</text></g></svg>