<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">四种数据测量尺度及可解释的运算</title><desc id="d">按名义、顺序、等距、比率四栏对比数据的性质、交通方式、满意等级、摄氏温度和通勤时间的实例，分别说明排序、差值和倍数何时有意义。</desc><rect width="900" height="340" rx="14" fill="#fff"/><text x="35" y="45" font-family="system-ui" font-size="18" font-weight="700" fill="#29484c">写下数据之前，先判断它允许什么运算</text><g><rect x="34" y="84" width="190" height="202" rx="12" fill="#ecf7f3" stroke="#147f80"/><text x="50" y="114" font-family="system-ui" font-size="16" font-weight="700" fill="#147f80">名义 Nominal</text><text x="50" y="145" font-family="system-ui" font-size="13" fill="#36565b">分类，无固有次序</text><text x="50" y="178" font-family="system-ui" font-size="15" font-weight="700" fill="#29484c">交通方式</text><text x="50" y="205" font-family="system-ui" font-size="12" fill="#536b70">步行／公交／骑行</text><line x1="50" y1="233" x2="206" y2="233" stroke="#147f80" stroke-opacity=".5"/><text x="50" y="260" font-family="system-ui" font-size="12" fill="#537174">可计算类别频数</text></g><g><rect x="242" y="84" width="190" height="202" rx="12" fill="#fff3eb" stroke="#c06d4c"/><text x="258" y="114" font-family="system-ui" font-size="16" font-weight="700" fill="#c06d4c">顺序 Ordinal</text><text x="258" y="145" font-family="system-ui" font-size="13" fill="#36565b">可以排序，间隔未定</text><text x="258" y="178" font-family="system-ui" font-size="15" font-weight="700" fill="#29484c">满意等级</text><text x="258" y="205" font-family="system-ui" font-size="12" fill="#536b70">很差＜一般＜很好</text><line x1="258" y1="233" x2="414" y2="233" stroke="#c06d4c" stroke-opacity=".5"/><text x="258" y="260" font-family="system-ui" font-size="12" fill="#537174">可比较等级高低</text></g><g><rect x="450" y="84" width="190" height="202" rx="12" fill="#f3f0fa" stroke="#7665aa"/><text x="466" y="114" font-family="system-ui" font-size="16" font-weight="700" fill="#7665aa">等距 Interval</text><text x="466" y="145" font-family="system-ui" font-size="13" fill="#36565b">差值有意义，零点任意</text><text x="466" y="178" font-family="system-ui" font-size="15" font-weight="700" fill="#29484c">摄氏温度</text><text x="466" y="205" font-family="system-ui" font-size="12" fill="#536b70">20°C − 10°C = 10°C</text><line x1="466" y1="233" x2="622" y2="233" stroke="#7665aa" stroke-opacity=".5"/><text x="466" y="260" font-family="system-ui" font-size="12" fill="#537174">不可解释倍数</text></g><g><rect x="658" y="84" width="190" height="202" rx="12" fill="#eef5f8" stroke="#59778a"/><text x="674" y="114" font-family="system-ui" font-size="16" font-weight="700" fill="#59778a">比率 Ratio</text><text x="674" y="145" font-family="system-ui" font-size="13" fill="#36565b">差值与比值都可解释</text><text x="674" y="178" font-family="system-ui" font-size="15" font-weight="700" fill="#29484c">通勤分钟数</text><text x="674" y="205" font-family="system-ui" font-size="12" fill="#536b70">20 分钟是 10 分钟的 2 倍</text><line x1="674" y1="233" x2="830" y2="233" stroke="#59778a" stroke-opacity=".5"/><text x="674" y="260" font-family="system-ui" font-size="12" fill="#537174">0 表示没有该数量</text></g><text x="38" y="316" font-family="system-ui" font-size="12" fill="#537174">尺度是一种数据解释规则；并非变量可以用数字编码，就能对编码取平均值。</text></svg>