<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">指数总体的不同样本量均值分布形状</title><desc id="d">假定原始观测独立服从均值1的指数分布，则样本均值n=1、2、8的确切概率密度分别为Gamma(shape=n,rate=n)，均值均为1，标准差为1除以根号n；随着n增大，形状变得更集中但有限n未完全正态。</desc><rect width="900" height="380" rx="15" fill="#fff"/><g font-family="system-ui,sans-serif">
<text x="35" y="44" font-size="20" font-weight="750" fill="#294b50">样本均值的分布可以比原始分布更集中</text><text x="36" y="78" font-size="13" fill="#5b7377">假设单次观测 X ~ Exp(rate=1)；实线均是理论密度，不是随机模拟。</text>
