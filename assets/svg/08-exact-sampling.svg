<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">总体和有放回的所有样本均值抽样分布</title><desc id="d">从有限总体0、2、4、6独立有放回抽两个值，产生16种等概率有序结果，样本均值0至6的频次依次为1、2、3、4、3、2、1。总体均值3，总体方差5，样本均值的方差2.5。</desc><rect width="900" height="380" rx="15" fill="#fff"/><g font-family="system-ui,sans-serif">
<text x="34" y="44" font-size="20" font-weight="750" fill="#294b50">抽样分布是“统计量在重复取样中”产生的分布</text>
<rect x="36" y="79" width="332" height="250" rx="13" fill="#edf6f3" stroke="#c4ddd6"/><text x="52" y="111" font-size="16" font-weight="700" fill="#31575a">有限总体（全部4个值）</text>
<circle cx="88" cy="186" r="25" fill="#147f80"/><text x="88" y="194" text-anchor="middle" fill="#fff" font-size="20" font-weight="740">0</text><circle cx="160" cy="186" r="25" fill="#147f80"/><text x="160" y="194" text-anchor="middle" fill="#fff" font-size="20" font-weight="740">2</text><circle cx="232" cy="186" r="25" fill="#147f80"/><text x="232" y="194" text-anchor="middle" fill="#fff" font-size="20" font-weight="740">4</text><circle cx="304" cy="186" r="25" fill="#147f80"/><text x="304" y="194" text-anchor="middle" fill="#fff" font-size="20" font-weight="740">6</text>
<text x="53" y="244" font-size="13" fill="#547276">总体均值 μ = 3；总体方差 σ² = 5</text>
<text x="53" y="276" font-size="13" fill="#547276">有放回抽 n=2，共 4×4=16 组</text>
<path d="M372 191H418" stroke="#c06d4c" stroke-width="3"/><path d="M411 185l9 6-9 6" stroke="#c06d4c" fill="none" stroke-width="2"/>
<rect x="431" y="79" width="432" height="250" rx="13" fill="#f8faf9" stroke="#dce7e3"/><text x="450" y="109" font-size="16" font-weight="700" fill="#31575a">所有16组样本均值的频数</text><path d="M466 277H834" stroke="#8faeaa" stroke-width="2"/>
<rect x="481" y="245" width="37" height="32" fill="#7665aa" rx="3"/><text x="499" y="234" text-anchor="middle" font-size="12" fill="#504a6b">1</text><text x="499" y="300" text-anchor="middle" font-size="13" fill="#596f73">0</text><rect x="529" y="213" width="37" height="64" fill="#7665aa" rx="3"/><text x="547" y="202" text-anchor="middle" font-size="12" fill="#504a6b">2</text><text x="547" y="300" text-anchor="middle" font-size="13" fill="#596f73">1</text><rect x="577" y="181" width="37" height="96" fill="#7665aa" rx="3"/><text x="595" y="170" text-anchor="middle" font-size="12" fill="#504a6b">3</text><text x="595" y="300" text-anchor="middle" font-size="13" fill="#596f73">2</text><rect x="625" y="149" width="37" height="128" fill="#7665aa" rx="3"/><text x="643" y="138" text-anchor="middle" font-size="12" fill="#504a6b">4</text><text x="643" y="300" text-anchor="middle" font-size="13" fill="#596f73">3</text><rect x="673" y="181" width="37" height="96" fill="#7665aa" rx="3"/><text x="691" y="170" text-anchor="middle" font-size="12" fill="#504a6b">3</text><text x="691" y="300" text-anchor="middle" font-size="13" fill="#596f73">4</text><rect x="721" y="213" width="37" height="64" fill="#7665aa" rx="3"/><text x="739" y="202" text-anchor="middle" font-size="12" fill="#504a6b">2</text><text x="739" y="300" text-anchor="middle" font-size="13" fill="#596f73">5</text><rect x="769" y="245" width="37" height="32" fill="#7665aa" rx="3"/><text x="787" y="234" text-anchor="middle" font-size="12" fill="#504a6b">1</text><text x="787" y="300" text-anchor="middle" font-size="13" fill="#596f73">6</text>
<text x="449" y="320" font-size="12" fill="#566e72">E(X̄)=3；Var(X̄)=2.5；抽样分布不是原始4个点。</text>
<text x="36" y="365" font-size="13" fill="#577174">所有16个有序样本等可能，柱高代表对应样本均值出现的次数（不是模拟直方图）。</text></g></svg>