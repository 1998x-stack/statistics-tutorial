<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="t d"><title id="t">四种抽样策略示意</title><desc id="d">每个小图均为20个总体单元，其中砖红色4个为样本，分别展示简单随机的分散选择、分层按层抽取、整群选取同群以及系统抽样按固定间隔取样。仅表示机制不表示实际抽样程序。</desc><rect width="900" height="410" rx="14" fill="#fff"/><text x="34" y="44" font-family="system-ui" font-size="18" font-weight="700" fill="#29484c">四种概率抽样：被选中的机制比“抽了多少”更重要</text><rect x="34" y="73" width="407" height="143" rx="12" fill="#f6faf8" stroke="#dbe8e3"/><text x="48" y="97" font-family="system-ui" font-size="15" font-weight="700" fill="#29484c">简单随机抽样</text><rect x="50" y="110" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="77" y="110" width="19" height="19" rx="5" fill="#c06d4c" stroke="#9f533a"/><rect x="104" y="110" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="131" y="110" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="158" y="110" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="50" y="137" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="77" y="137" width="19" height="19" rx="5" fill="#c06d4c" stroke="#9f533a"/><rect x="104" y="137" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="131" y="137" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="158" y="137" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="50" y="164" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="77" y="164" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="104" y="164" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="131" y="164" width="19" height="19" rx="5" fill="#c06d4c" stroke="#9f533a"/><rect x="158" y="164" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="50" y="191" width="19" height="19" rx="5" fill="#c6ddd8" stroke="#9dbdb6"/><rect x="77" y="191" width="19"