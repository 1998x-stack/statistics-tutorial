<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465" role="img" aria-labelledby="t d">
<title id="t">重复抽样下 95% 置信区间的长期覆盖率</title>
<desc id="d">20 次独立抽样各给出一个 95% 置信区间，用水平线段表示；其中 19 条线段与真实参数 μ 所在的竖直虚线相交，第 11 条完全落在 μ 的左侧而未覆盖。</desc>
<rect width="900" height="465" rx="15" fill="#fff"/>
<g font-family="system-ui,sans-serif">
<text x="36" y="42" font-size="20" font-weight="750" fill="#294b50">95% 置信区间：长期约有 95% 的区间覆盖 μ</text>
<text x="37" y="72" font-size="14" fill="#587174">每条线段是“同一方法”在一次次独立样本上算出的区间；μ 固定不动</text>
<path d="M470 78V412" stroke="#147f80" stroke-width="2" stroke-dasharray="6 5"/>
<text x="470" y="443" text-anchor="middle" font-size="13" font-weight="700" fill="#147f80">μ</text>
<g stroke="#147f80" stroke-width="6">
<line x1="368" y1="95" x2="512" y2="95"/><line x1="428" y1="112" x2="572" y2="112"/><line x1="398" y1="129" x2="542" y2="129"/><line x1="448" y1="146" x2="592" y2="146"/><line x1="378" y1="163" x2="522" y2="163"/><line x1="358" y1="180" x2="502" y2="180"/><line x1="418" y1="197" x2="562" y2="197"/><line x1="388" y1="214" x2="532" y2="214"/><line x1="408" y1="231" x2="552" y2="231"/><line x1="373" y1="248" x2="517" y2="248"/>
<line x1="398" y1="282" x2="542" y2="282"/><line x1="438" y1="299" x2="582" y2="299"/><line x1="368" y1="316" x2="512" y2="316"/><line x1="393" y1="333" x2="537" y2="333"/><line x1="413" y1="350" x2="557" y2="350"/><line x1="383" y1="367" x2="527" y2="367"/><line x1="353" y1="384" x2="497" y2="384"/><line x1="428" y1="401" x2="572" y2="401"/><line x1="388" y1="418" x2="532" y2="418"/>
</g>
<line x1="228" y1="265" x2="372" y2="265" stroke="#c06d4c" stroke-width="6"/>
<text x="228" y="260" text-anchor="start" font-size="12" font-weight="700" fill="#c06d4c">未覆盖</text>
<text x="36" y="458" font-size="12" fill="#597477">线段位置与宽度均为教学示意；若覆盖率真为 95%，20 条中出现 1 条未覆盖完全正常。</text>
</g></svg>
