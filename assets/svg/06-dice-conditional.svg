<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">掷骰子的条件概率从样本空间筛选事件</title><desc id="d">公平六面骰的可能结果为1至6；事件A为点数至少5即5、6，事件B为偶数即2、4、6。B条件下只剩2、4、6三个等可能结果，其与A的交集仅6，故P(A|B)=1/3，反向条件P(B|A)=1/2。</desc><rect width="900" height="380" rx="16" fill="#fff"/><g font-family="system-ui, sans-serif">
<text x="38" y="44" font-size="20" font-weight="750" fill="#294b50">条件发生后，先缩小分母里的样本空间</text><text x="39" y="91" font-size="15" fill="#4e6a6f">A = {5,6}（至少 5 点）　B = {2,4,6}（偶数）</text>
<rect x="37" y="120" width="120" height="114" rx="13" fill="#f5f7f6" stroke="#d5e1dd" stroke-width="2"/><text x="97" y="180" font-size="34" text-anchor="middle" font-weight="750" fill="#31555a">1</text><text x="97" y="214" font-size="12" text-anchor="middle" fill="#5b7174">两者均非</text><rect x="176" y="120" width="120" height="114" rx="13" fill="#d8eee9" stroke="#d5e1dd" stroke-width="2"/><text x="236" y="180" font-size="34" text-anchor="middle" font-weight="750" fill="#31555a">2</text><text x="236" y="214" font-size="12" text-anchor="middle" fill="#5b7174">仅 B</text><rect x="315" y="120" width="120" height="114" rx="13" fill="#f5f7f6" stroke="#d5e1dd" stroke-width="2"/><text x="375" y="180" font-size="34" text-anchor="middle" font-weight="750" fill="#31555a">3</text><text x="375" y="214" font-size="12" text-anchor="middle" fill="#5b7174">两者均非</text><rect x="454" y="120" width="120" height="114" rx="13" fill="#d8eee9" stroke="#d5e1dd" stroke-width="2"/><text x="514" y="180" font-size="34" text-anchor="middle" font-weight="750" fill="#31555a">4</text><text x="514" y="214" font-size="12" text-anchor="middle" fill="#5b7174">仅 B</text><rect x="593" y="120" width="120" height="114" rx="13" fill="#f9e9df" stroke="#d5e1dd" stroke-width="2"/><text x="653" y="180" font-size="34" text-anchor="middle" font-weight="750" fill="#31555a">5</text><text x="653" y="214" font-size="12" text-anchor="middle" fill="#5b7174">仅 A</text><rect x="732" y="120" width="120" height="114" rx="13" fill="#eec7b2" stroke="#c06d4c" stroke-width="2"/><text x="792" y="180" font-size="34" text-anchor="middle" font-weight="750" fill="#31555a">6</text><text x="792" y="214" font-size="12" text-anchor="middle" fill="#5b7174">A∩B</text>
<rect x="37" y="259" width="393" height="82" rx="11" fill="#e8f5f1" stroke="#a1d0c6"/><text x="57" y="292" font-size="15" fill="#315b60" font-weight="700">P(A | B) = 1 / 3</text><text x="57" y="319" font-size="12" fill="#60777a">先确认 B，分母是 3 个偶数结果</text>
<rect x="461" y="259" width="401" height="82" rx="11" fill="#fff0e8" stroke="#e0ad92"/><text x="481" y="292" font-size="15" fill="#a75538" font-weight="700">P(B | A) = 1 / 2</text><text x="481" y="319" font-size="12" fill="#60777a">先确认 A，分母是 2 个较大结果</text></g></svg>