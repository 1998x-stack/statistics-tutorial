<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">Tukey箱线图显示分位数、须和离群点</title><desc id="d">九个合成观测为1、2、3、3、4、5、6、7、18。按排除中位数的四分位数定义，Q1为2.5，Q3为6.5，IQR为4；1.5IQR界限是-3.5和12.5，须端为1和7，18作为潜在离群点单独展示。</desc><rect width="900" height="380" rx="16" fill="#fff"/><g font-family="system-ui, sans-serif">
<text x="38" y="49" font-size="21" font-weight="750" fill="#294b50">箱线图的五个层次：原始值 → 四分位数 → 围栏 → 须 → 离群点</text>
<text x="43" y="91" font-size="15" fill="#536b70">样本：1, 2, 3, 3, 4, 5, 6, 7, 18</text>
<path d="M100 287H825" stroke="#95b2b0" stroke-width="2"/><g><path d="M100 281v12" stroke="#95b2b0"/><text x="100" y="316" font-size="13" text-anchor="middle" fill="#597377">0</text></g><g><path d="M281.25 281v12" stroke="#95b2b0"/><text x="281.25" y="316" font-size="13" text-anchor="middle" fill="#597377">5</text></g><g><path d="M462.5 281v12" stroke="#95b2b0"/><text x="462.5" y="316" font-size="13" text-anchor="middle" fill="#597377">10</text></g><g><path d="M643.75 281v12" stroke="#95b2b0"/><text x="643.75" y="316" font-size="13" text-anchor="middle" fill="#597377">15</text></g><g><path d="M825 281v12" stroke="#95b2b0"/><text x="825" y="316" font-size="13" text-anchor="middle" fill="#597377">20</text></g>
<g transform="translate(100,0)" stroke-width="3"><line x1="36.25" y1="199" x2="90.625" y2="199" stroke="#147f80"/><line x1="235.625" y1="199" x2="253.75" y2="199" stroke="#147f80"/><line x1="36.25" y1="161" x2="36.25" y2="238" stroke="#147f80"/><line x1="253.75" y1="161" x2="253.75" y2="238" stroke="#147f80"/><rect x="90.625" y="158" width="145" height="82" rx="6" fill="#e0f0eb" stroke="#147f80"/><line x1="145" y1="158" x2="145" y2="240" stroke="#c06d4c" stroke-width="5"/><circle cx="652.5" cy="199" r="12" fill="#c06d4c" stroke="white" stroke-width="4"/></g>
<g font-size="13" font-weight="650" fill="#294b50"><text x="115" y="147">最小非异常值 1</text><text x="210" y="130">Q1=2.5</text><text x="237" y="264" fill="#c06d4c">中位数 4</text><text x="330" y="130">Q3=6.5</text><text x="372" y="264">上须 7</text><text x="726" y="176" fill="#c06d4c">18</text><text x="684" y="193" fill="#c06d4c">潜在离群点</text></g>
<g font-size="13" fill="#536b70"><text x="42" y="341">IQR = 6.5 − 2.5 = 4；上界 = 6.5 + 1.5 × 4 = 12.5；18 超出上界。</text></g></g></svg>