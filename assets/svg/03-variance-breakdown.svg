<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">样本方差分解为各个离均差平方</title><desc id="d">五个值2、3、3、4、8以均值4为中心，离差分别为负2、负1、负1、0、正4，平方分别4、1、1、0、16，平方和22，样本方差用22除以4得到5.5。</desc><rect width="900" height="400" rx="14" fill="#fff"/><text x="34" y="40" font-family="system-ui" font-size="18" font-weight="700" fill="#29494d">离均差先平方，最后再除以 n − 1</text><g font-family="system-ui" font-size="14" fill="#31585c" font-weight="700"><text x="85" y="90">观测值 x</text><text x="264" y="90">x − 均值 4</text><text x="440" y="90">(x − 4)²</text></g><g><rect x="46" y="110" width="482" height="36" rx="5" fill="#ecf5f2"/><text x="85" y="134" font-family="system-ui" font-size="14" fill="#344f54">2</text><text x="264" y="134" font-family="system-ui" font-size="14" fill="#344f54">−2</text><text x="440" y="134" font-family="system-ui" font-size="14" fill="#344f54" font-weight="400">4</text></g><g><rect x="46" y="154" width="482" height="36" rx="5" fill="#f6f9f8"/><text x="85" y="178" font-family="system-ui" font-size="14" fill="#344f54">3</text><text x="264" y="178" font-family="system-ui" font-size="14" fill="#344f54">−1</text><text x="440" y="178" font-family="system-ui" font-size="14" fill="#344f54" font-weight="400">1</text></g><g><rect x="46" y="198" width="482" height="36" rx="5" fill="#ecf5f2"/><text x="85" y="222" font-family="system-ui" font-size="14" fill="#344f54">3</text><text x="264" y="222" font-family="system-ui" font-size="14" fill="#344f54">−1</text><text x="440" y="222" font-family="system-ui" font-size="14" fill="#344f54" font-weight="400">1</text></g><g><rect x="46" y="242" width="482" height="36" rx="5" fill="#f6f9f8"/><text x="85" y="266" font-family="system-ui" font-size="14" fill="#344f54">4</text><text x="264" y="266" font-family="system-ui" font-size="14" fill="#344f54">0</text><text x="440" y="266" font-family="system-ui" font-size="14" fill="#344f54" font-weight="400">0</text></g><g><rect x="46" y="286" width="482" height="36" rx="5" fill="#ecf5f2"/><text x="85" y="310" font-family="system-ui" font-size="14" fill="#344f54">8</text><text x="264" y="310" font-family="system-ui" font-size="14" fill="#344f54">+4</text><text x="440" y="310" font-family="system-ui" font-size="14" fill="#c06d4c" font-weight="700">16</text></g><path d="M560 193H605" stroke="#c06d4c" stroke-width="3"/><path d="M597 185l10 8-10 8" stroke="#c06d4c" stroke-width="3" fill="none"/><rect x="616" y="111" width="249" height="220" rx="14" fill="#fff3eb" stroke="#e2aa90"/><g font-family="system-ui" fill="#6f5146"><text x="636" y="149" font-size="15" font-weight="700">平方和</text><text x="636" y="183" font-size="22" font-weight="750">4+1+1+0+16 = 22</text><text x="636" y="229" font-size="15">样本方差</text><text x="636" y="266" font-size="24" font-weight="750" fill="#c06d4c">s² = 22 / 4 = 5.5</text><text x="636" y="302" font-size="13">n = 5，因此 n − 1 = 4</text></g><text x="36" y="375" font-family="system-ui" font-size="12" fill="#537174">若五个数就是完整总体，则总体方差按 N = 5 计算，为 22 / 5 = 4.4。</text></svg>