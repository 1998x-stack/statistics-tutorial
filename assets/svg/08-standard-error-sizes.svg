<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">样本均值标准误随样本量平方根缩减</title><desc id="d">在独立同分布且总体标准差sigma=5的理想情形下，样本量n分别为1、4、16、25、100时，样本均值标准误依次为5、2.5、1.25、1、0.5。</desc><rect width="900" height="380" rx="15" fill="#fff"/><g font-family="system-ui,sans-serif">
<text x="36" y="43" font-size="20" font-weight="750" fill="#294b50">样本量翻 4 倍，标准误才缩小一半</text><text x="37" y="77" font-size="14" fill="#587174">假定总体标准差 σ = 5，重复独立、同分布抽样</text>
<path d="M89 288H838M89 288V118" stroke="#92acaa" stroke-width="2"/>
<path d="M83 138h8" stroke="#92acaa"/><text x="73" y="143" text-anchor="end" font-size="12" fill="#5a7476">5</text><path d="M83 168h8" stroke="#92acaa"/><text x="73" y="173" text-anchor="end" font-size="12" fill="#5a7476">4</text><path d="M83 198h8" stroke="#92acaa"/><text x="73" y="203" text-anchor="end" font-size="12" fill="#5a7476">3</text><path d="M83 228h8" stroke="#92acaa"/><text x="73" y="233" text-anchor="end" font-size="12" fill="#5a7476">2</text><path d="M83 258h8" stroke="#92acaa"/><text x="73" y="263" text-anchor="end" font-size="12" fill="#5a7476">1</text><path d="M83 288h8" stroke="#92acaa"/><text x="73" y="293" text-anchor="end" font-size="12" fill="#5a7476">0</text>
<rect x="125" y="138" width="70" height="150" rx="5" fill="#c06d4c"/><text x="160" y="125" text-anchor="middle" font-size="14" fill="#31555a" font-weight="700">5</text><text x="160" y="317" text-anchor="middle" font-size="13" fill="#5a7476">n=1</text><rect x="271" y="213" width="70" height="75" rx="5" fill="#147f80"/><text x="306" y="200" text-anchor="middle" font-size="14" fill="#31555a" font-weight="700">2.5</text><text x="306" y="317" text-anchor="middle" font-size="13" fill="#5a7476">n=4</text><rect x="417" y="250.5" width="70" height="37.5" rx="5" fill="#147f80"/><text x="452" y="237.5" text-anchor="middle" font-size="14" fill="#31555a" font-weight="700">1.25</text><text x="452" y="317" text-anchor="middle" font-size="13" fill="#5a7476">n=16</text><rect x="563" y="258" width="70" height="30" rx="5" fill="#147f80"/><text x="598" y="245" text-anchor="middle" font-size="14" fill="#31555a" font-weight="700">1</text><text x="598" y="317" text-anchor="middle" font-size="13" fill="#5a7476">n=25</text><rect x="709" y="273" width="70" height="15" rx="5" fill="#147f80"/><text x="744" y="260" text-anchor="middle" font-size="14" fill="#31555a" font-weight="700">0.5</text><text x="744" y="317" text-anchor="middle" font-size="13" fill="#5a7476">n=100</text>
<text x="36" y="359" font-size="12" fill="#597477">这里的 σ 不是单个样本的标准差 s，而是推导使用的总体标准差。</text></g></svg>