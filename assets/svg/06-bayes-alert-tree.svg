<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">稀有故障场景的贝叶斯频数树</title><desc id="d">在10000个设备中假设1%真实故障，有100个故障设备和9900个正常设备。检测系统的故障召回率90%且正常设备的误报率5%，故障报警90例，正常误报警495例，所有报警585例，报警的真实故障比例90/585约15.4%。</desc><rect width="900" height="400" rx="16" fill="#fff"/><g font-family="system-ui, sans-serif">
<text x="30" y="42" font-size="20" font-weight="750" fill="#294b50">报警 ≠ 故障：先看基率，再看检测</text>
<rect x="31" y="161" width="143" height="73" rx="12" fill="#eff5f2" stroke="#8dbbb2"/><text x="48" y="188" font-size="17" fill="#294b50" font-weight="700">10,000 台设备</text><text x="48" y="211" font-size="13" fill="#597174">合成总体</text>
<g stroke="#95adaa" stroke-width="2.5" fill="none"><path d="M174 197L266 111M174 197L266 283"/><path d="M411 112L500 88M411 112L500 166M411 283L500 256M411 283L500 335"/></g>
<rect x="268" y="73" width="144" height="76" rx="12" fill="#fff0e8" stroke="#d39c82"/><text x="282" y="100" font-size="15" fill="#944e36" font-weight="750">故障 100</text><text x="282" y="126" font-size="13" fill="#5d6c70">1% 基率</text>
<rect x="268" y="244" width="144" height="76" rx="12" fill="#e6f3ef" stroke="#9ec6bc"/><text x="282" y="271" font-size="15" fill="#196c6f" font-weight="750">正常 9,900</text><text x="282" y="296" font-size="13" fill="#5d6c70">99% 基率</text>
<rect x="502" y="54" width="193" height="65" rx="9" fill="#f9fbfa" stroke="#dbe6e2"/><text x="516" y="81" font-size="15" font-weight="700" fill="#c06d4c">真报警 90</text><text x="516" y="103" font-size="12" fill="#667d80">90% 灵敏度</text><rect x="502" y="133" width="193" height="65" rx="9" fill="#f9fbfa" stroke="#dbe6e2"/><text x="516" y="160" font-size="15" font-weight="700" fill="#a66c82">漏报 10</text><text x="516" y="182" font-size="12" fill="#667d80">10% 漏报率</text><rect x="502" y="220" width="193" height="65" rx="9" fill="#f9fbfa" stroke="#dbe6e2"/><text x="516" y="247" font-size="15" font-weight="700" fill="#c06d4c">误报警 495</text><text x="516" y="269" font-size="12" fill="#667d80">5% 假阳率</text><rect x="502" y="305" width="193" height="65" rx="9" fill="#f9fbfa" stroke="#dbe6e2"/><text x="516" y="332" font-size="15" font-weight="700" fill="#147f80">正确未报警 9405</text><text x="516" y="354" font-size="12" fill="#667d80">95% 特异度</text>
<path d="M700 90H743V265H760M700 251H760" stroke="#c06d4c" stroke-width="2.5" fill="none"/><rect x="760" y="176" width="126" height="119" rx="11" fill="#fff0e8" stroke="#c06d4c"/><text x="771" y="207" font-size="14" font-weight="700" fill="#944e36">所有报警</text><text x="771" y="236" font-size="19" font-weight="750" fill="#c06d4c">585</text><text x="771" y="264" font-size="13" fill="#944e36">90 / 585</text><text x="771" y="282" font-size="13" fill="#944e36">≈ 15.4%</text></g></svg>