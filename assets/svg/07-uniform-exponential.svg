<svg xmlns="http://www.w3.org/2000/svg" width="900" height="375" viewBox="0 0 900 375" role="img" aria-labelledby="t d"><title id="t">均匀分布与指数分布的密度形态</title><desc id="d">左图为在0至1区间恒定密度1的均匀分布；右图为rate=1且x非负的指数分布，密度从1开始指数衰减。连续分布的概率必须由面积得到。</desc><rect width="900" height="375" rx="16" fill="#fff"/><g font-family="system-ui,sans-serif">
<text x="35" y="43" font-size="20" font-weight="750" fill="#294b50">同为连续量：平坦与递减的密度讲不同的过程</text>
