<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="t d"><title id="t">一个极端值怎样影响均值和中位数</title><desc id="d">上图为2、3、3、4、8，均值4、中位数3；下图只把8改成18，均值变为6、中位数仍为3。青色竖线为中位数，橙色线为均值。</desc><rect width="900" height="410" rx="14" fill="#fff"/><text x="30" y="42" font-family="system-ui" font-size="18" font-weight="700" fill="#29494d">只改变最后一个观测值，中心会怎样移动？</text><text x="39" y="86" font-family="system-ui" font-size="14" fill="#506b70">原始样本：2，3，3，4，8</text><path d="M90 168H827" stroke="#9eb7b4" stroke-width="2"/><path d="M90 163v10" stroke="#9eb7b4"/><text x="90" y="191" text-anchor="middle" font-family="system-ui" font-size="12" fill="#547074">0</text><path d="M265 163v10" stroke="#9eb7b4"/><text x="265" y="191" text-anchor="middle" font-family="system-ui" font-size="12" fill="#547074">5</text><path d="M440 163v10" stroke="#9eb7b4"/><text x="440" y="191" text-anchor="middle" font-family="system-ui" font-size="12" fill="#547074">10</text><path d="M615 163v10" stroke="#9eb7b4"/><text x="615" y="191" text-anchor="middle" font-family="system-ui" font-size="12" fill="#547074">15</text><path d="M790 163v10" stroke="#9eb7b4"/><text x="790" y="191" text-anchor="middle" font-family="system-ui" font-size="12" fill="#547074">20</text><circle cx="160" cy="149" r="9" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="195" cy="149" r="9" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="195" cy="127" r="9" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="230" cy="149" r="9" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="370" cy="149" r="9" fill="#c06d4c" stroke="#fff" stroke-width="2"/><path d="M195 107V180" stroke="#147f80" stroke-width="3" stroke-dasharray="5 4"/><path d="M230 107V180" stroke="#c06d4c" stroke-width="3"/><text x="235" y="120" font-family="system-ui" font-size="12" fill="#c06d4c">均值 4</text><text x="127" y="120" font-family="system-ui" font-size="12" fill="#147f80">中位数 3</text><text x="39" y="236" font-family="system-ui" font-size="14" fill="#506b70">把 8 换成 18：2，3，3，4，18</text><path d="M90 322H827" stroke="#9eb7b4" stroke-width="2"/><path d="M90 317v10" stroke="#9eb7b4"/><text x="90" y="345" text-anchor="middle" font-family="system-ui" font-size="12" fill="#547074">0</text><path d="M265 317v10" stroke="#9eb7b4"/><text x="265" y="345" text-anchor="middle" font-family="system-ui" font-size="12" fill="#547074">5</text><path d="M440 317v10" stroke="#9eb7b4"/><text x="440" y="345" text-anchor="middle" font-family="system-ui" font-size="12" fill="#547074">10</text><path d="M615 317v10" stroke="#9eb7b4"/><text x="615" y="345" text-anchor="middle" font-family="system-ui" font-size="12" fill="#547074">15</text><path d="M790 317v10" stroke="#9eb7b4"/><text x="790" y="345" text-anchor="middle" font-family="system-ui" font-size="12" fill="#547074">20</text><circle cx="160" cy="303" r="9" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="195" cy="303" r="9" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="195" cy="281" r="9" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="230" cy="303" r="9" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="720" cy="303" r="9" fill="#c06d4c" stroke="#fff" stroke-width="2"/><path d="M195 260V334" stroke="#147f80" stroke-width="3" stroke-dasharray="5 4"/><path d="M300 260V334" stroke="#c06d4c" stroke-width="3"/><text x="305" y="272" font-family="system-ui" font-size="12" fill="#c06d4c">均值 6</text><text x="124" y="273" font-family="system-ui" font-size="12" fill="#147f80">中位数 3</text><text x="38" y="390" font-family="system-ui" font-size="12" fill="#506b70">同一组内的 4 个观测不变，极端值让均值右移 2，中位数保持原位。</text></svg>