<svg xmlns="http://www.w3.org/2000/svg" width="900" height="325" viewBox="0 0 900 325" role="img" aria-labelledby="t d"><title id="t">描述统计与统计推断的不同目标</title><desc id="d">共同起点是数据；上分支用汇总数值描述现有数据，下分支需要抽样设计和模型假设，才能对目标总体做估计并表达不确定性。</desc><rect width="900" height="325" rx="14" fill="#fff"/><text x="32" y="42" font-family="system-ui" font-size="18" font-weight="700" fill="#294a50">两种问题，不是两套互相替代的工具</text><rect x="32" y="127" width="154" height="83" rx="13" fill="#edf6f3" stroke="#147f80" stroke-width="2"/><text x="109" y="162" text-anchor="middle" font-family="system-ui" font-size="17" fill="#147f80" font-weight="700">已观察数据</text><text x="109" y="185" text-anchor="middle" font-family="system-ui" font-size="12" fill="#557176">n 个记录</text><path d="M186 166H253V99H298M253 166V245H298" stroke="#668889" stroke-width="3" fill="none"/><path d="M291 92l9 7-9 7M291 238l9 7-9 7" fill="none" stroke="#668889" stroke-width="2.4"/><rect x="303" y="61" width="234" height="95" rx="12" fill="#e8f5f1" stroke="#147f80"/><text x="320" y="95" font-family="system-ui" font-size="16" fill="#147f80" font-weight="700">描述统计</text><text x="320" y="123" font-family="system-ui" font-size="13" fill="#31575a">样本均值、频率、散布</text><rect x="303" y="198" width="234" height="94" rx="12" fill="#f6eefc" stroke="#7665aa"/><text x="320" y="232" font-family="system-ui" font-size="16" fill="#7665aa" font-weight="700">统计推断</text><text x="320" y="260" font-family="system-ui" font-size="13" fill="#31575a">抽样机制 + 模型假设</text><path d="M537 110H601M537 245H601" stroke="#8d9998" stroke-width="2.5"/><path d="M592 103l10 7-10 7M592 238l10 7-10 7" fill="none" stroke="#8d9998" stroke-width="2.3"/><rect x="607" y="68" width="252" height="83" rx="12" fill="#fff" stroke="#ccdcd7"/><text x="627" y="101" font-family="system-ui" font-size="15" fill="#294a50" font-weight="700">我们手上有哪些特征？</text><text x="627" y="125" font-family="system-ui" font-size="12" fill="#536b70">结论限定在已观察数据</text><rect x="607" y="207" width="252" height="83" rx="12" fill="#fff" stroke="#ccdcd7"/><text x="627" y="240" font-family="system-ui" font-size="15" fill="#294a50" font-weight="700">目标总体可能怎样？</text><text x="627" y="264" font-family="system-ui" font-size="12" fill="#536b70">附带误差、区间与适用条件</text></svg>