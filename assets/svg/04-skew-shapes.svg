<svg xmlns="http://www.w3.org/2000/svg" width="900" height="382" viewBox="0 0 900 382" role="img" aria-labelledby="t d"><title id="t">左偏、对称和右偏分布的直观形状</title><desc id="d">三幅直方分布示意：左偏的长尾在左、近似对称的两侧相仿、右偏的长尾在右。是概念形态示意而非实测数据；均值和中位数位置关系不能单独确定偏度符号。</desc><rect width="900" height="382" rx="16" fill="#fff"/><g font-family="system-ui, sans-serif">
