<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
<title id="t">奶茶实验：纯靠猜时猜对杯数的精确零分布</title>
<desc id="d">横轴表示在 8 杯中正确猜出先加奶的 4 个杯子的数量，纵轴为概率。恰好猜对 4 杯的概率只有 70 分之一，约 0.014；猜对 3 杯 16/70，2 杯 36/70，1 杯 16/70，0 杯 1/70。</desc>
<rect width="900" height="400" rx="15" fill="#fff"/>
<g font-family="system-ui,sans-serif">
<text x="36" y="42" font-size="20" font-weight="750" fill="#294b50">纯靠猜时，全部猜对只有 1/70 ≈ 0.014</text>
<text x="37" y="72" font-size="14" fill="#587174">8 杯选 4 杯共有 C(8,4)=70 种等可能结果（超几何分布）</text>
<path d="M110 330H840M110 330V100" stroke="#92acaa" stroke-width="2"/>
<text x="46" y="104" font-size="12" fill="#5a7476">概率</text>
<text x="826" y="356" text-anchor="end" font-size="12" fill="#5a7476">正确杯数</text>
<rect x="150" y="325" width="90" height="5" rx="2" fill="#147f80"/><text x="195" y="318" text-anchor="middle" font-size="12" fill="#5a7476">1/70</text><text x="195" y="352" text-anchor="middle" font-size="13" fill="#31555a">0</text>
<rect x="290" y="250" width="90" height="80" rx="2" fill="#147f80"/><text x="335" y="243" text-anchor="middle" font-size="12" fill="#5a7476">16/70</text><text x="335" y="352" text-anchor="middle" font-size="13" fill="#31555a">1</text>
<rect x="430" y="130" width="90" height="200" rx="2" fill="#147f80"/><text x="475" y="123" text-anchor="middle" font-size="12" fill="#5a7476">36/70</text><text x="475" y="352" text-anchor="middle" font-size="13" fill="#31555a">2</text>
<rect x="570" y="250" width="90" height="80" rx="2" fill="#147f80"/><text x="615" y="243" text-anchor="middle" font-size="12" fill="#5a7476">16/70</text><text x="615" y="352" text-anchor="middle" font-size="13" fill="#31555a">3</text>
<rect x="710" y="325" width="90" height="5" rx="2" fill="#c06d4c"/><text x="755" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#c06d4c">1/70</text><text x="755" y="352" text-anchor="middle" font-size="13" fill="#31555a">4</text>
<text x="36" y="385" font-size="12" fill="#597477">p 值就是“猜对 4 杯或更多”的尾部概率，此处正好等于 1/70。</text>
</g></svg>
