<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">同一组连续数据用不同直方图区间宽度显示</title><desc id="d">十二个合成值1、1、2、2、2、3、3、4、4、5、8、9。宽度2的直方图以0为起点，五个箱计数为2、5、3、0、2；宽度5的直方图两箱计数为9和3，形态大幅简化。</desc><rect width="900" height="380" rx="16" fill="#fff"/><g font-family="system-ui, sans-serif">
<text x="32" y="41" font-size="20" font-weight="750" fill="#294b50">组距改变了你看到的形状，不改变观测值</text>
