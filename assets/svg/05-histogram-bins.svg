hor="middle" fill="#294b50">9</text><text x="596.5" y="311" font-size="12" text-anchor="middle" fill="#5b7377">0–5</text><rect x="673" y="234" width="153" height="51" fill="#147f80" stroke="#fff" stroke-width="2"/><text x="749.5" y="225" font-size="12" text-anchor="middle" fill="#294b50">3</text><text x="749.5" y="311" font-size="12" text-anchor="middle" fill="#5b7377">5–10</text></rect>
<text x="40" y="367" font-size="12" fill="#536b70">横轴为连续数值区间（左闭右开），直方图柱子相邻；这些不是离散类别。</text></g></svg>