<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">事件、联合、条件和随机变量的概念流</title><desc id="d">随机实验先定义样本空间Ω，事件是样本空间的子集；事件可以求联合与条件概率，也可以通过随机变量X将基本结果映射为数值，再导出离散概率分布。</desc><rect width="900" height="380" rx="16" fill="#fff"/><g font-family="system-ui, sans-serif">
<text x="38" y="45" font-size="20" font-weight="750" fill="#294b50">从一次随机实验到可以计算的随机变量</text>
<rect x="32" y="122" width="183" height="91" rx="12" fill="#edf6f3" stroke="#c8dcd6"/><text x="47" y="156" font-size="17" font-weight="740" fill="#294b50">随机实验</text><text x="47" y="184" font-size="13" fill="#557176">掷一颗公平骰子</text><rect x="276" y="122" width="203" height="91" rx="12" fill="#edf6f3" stroke="#c8dcd6"/><text x="291" y="156" font-size="17" font-weight="740" fill="#294b50">样本空间 Ω</text><text x="291" y="184" font-size="13" fill="#557176">{1,2,3,4,5,6}</text><rect x="546" y="72" width="308" height="91" rx="12" fill="#fff1e9" stroke="#c8dcd6"/><text x="561" y="106" font-size="17" font-weight="740" fill="#294b50">事件 A / B</text><text x="561" y="134" font-size="13" fill="#557176">A={5,6}; B={2,4,6}</text><rect x="546" y="191" width="308" height="91" rx="12" fill="#f1edfa" stroke="#c8dcd6"/><text x="561" y="225" font-size="17" font-weight="740" fill="#294b50">随机变量 X</text><text x="561" y="253" font-size="13" fill="#557176">X=1（偶数），否则 0</text>
<path d="M215 166H272M479 166H510V117H542M510 166V235H542" stroke="#799b99" stroke-width="3" fill="none"/><text x="46" y="328" font-size="14" fill="#557176">P(X=1)=3/6=0.5；P(X=0)=3/6=0.5；概率分布必须非负并总和为 1。</text></g></svg>