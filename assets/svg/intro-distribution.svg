<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc"><title id="title">统计学从观察样本到理解总体的推断过程</title><desc id="desc">左边为由不同值组成的总体分布，中间框选观测样本，右边是基于样本推断的估计和不确定性区间。</desc><rect width="640" height="430" rx="18" fill="#fbfcfa"/><g font-family="system-ui, sans-serif" fill="#27444a"><text x="36" y="40" font-size="17" font-weight="700">从有限观察，走向有边界的结论</text><text x="36" y="68" font-size="12" fill="#668084">Population → Sample → Inference</text></g><g stroke="#e5ebe7" stroke-width="1"><path d="M32 335H608M32 277H608M32 219H608M32 161H608"/></g><g transform="translate(38,106)" fill="#b8d8d0"><rect x="0" y="118" width="19" height="111" rx="4"/><rect x="23" y="83" width="19" height="146" rx="4"/><rect x="46" y="48" width="19" height="181" rx="4"/><rect x="69" y="29" width="19" height="200" rx="4"/><rect x="92" y="53" width="19" height="176" rx="4"/><rect x="115" y="94" width="19" height="135" rx="4"/><rect x="138" y="152" width="19" height="77" rx="4"/></g><rect x="78" y="123" width="77" height="222" rx="9" stroke="#c06d4c" stroke-width="3" fill="#e7a07d" fill-opacity=".15" stroke-dasharray="7 7"/><g font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#38575b"><text x="36" y="366">总体分布</text><text x="92" y="394" fill="#c06d4c">样本</text></g><path d="M232 228H281" stroke="#c06d4c" stroke-width="3"/><path d="M272 221L283 228L272 235" stroke="#c06d4c" stroke-width="3" fill="none"/><g><rect x="294" y="129" width="292" height="216" rx="16" fill="#fff" stroke="#dce5e1" stroke-width="2"/><text x="318" y="164" font-family="system-ui" font-size="14" fill="#27444a" font-weight="700">由样本估计</text><line x1="322" y1="231" x2="560" y2="231" stroke="#95a9a9" stroke-width="2"/><rect x="366" y="218" width="143" height="26" rx="13" fill="#e8f2ed" stroke="#78aaa5"/><line x1="438" y1="192" x2="438" y2="267" stroke="#147f80" stroke-width="3"/><circle cx="438" cy="231" r="9" fill="#147f80" stroke="#fff" stroke-width="3"/><text x="420" y="185" font-family="system-ui" font-size="15" fill="#147f80" font-weight="700">估计值</text><text x="345" y="289" font-family="system-ui" font-size="12" fill="#597277">不确定性区间：表达精度与局限</text></g></svg>