<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-09 desc-09"><title id="title-09">区间估计表达估计的不确定性</title><desc id="desc-09">每个区间来自一次样本；重复抽样时，区间覆盖真值的长期比例由方法保证。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><line x1="90" y1="40" x2="90" y2="208" stroke="#d38a32" stroke-width="4" stroke-dasharray="5 5"/><text x="90" y="25" text-anchor="middle" class="small">参数真值</text><line x1="150" y1="58" x2="410" y2="58" stroke="#4386d8" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="58" r="5" fill="#4386d8"/><circle cx="410" cy="58" r="5" fill="#4386d8"/><line x1="170" y1="92" x2="445" y2="92" stroke="#4386d8" stroke-width="5" stroke-linecap="round"/><circle cx="170" cy="92" r="5" fill="#4386d8"/><circle cx="445" cy="92" r="5" fill="#4386d8"/><line x1="150" y1="126" x2="480" y2="126" stroke="#d97706" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="126" r="5" fill="#4386d8"/><circle cx="480" cy="126" r="5" fill="#4386d8"/><line x1="170" y1="160" x2="410" y2="160" stroke="#4386d8" stroke-width="5" stroke-linecap="round"/><circle cx="170" cy="160" r="5" fill="#4386d8"/><circle cx="410" cy="160" r="5" fill="#4386d8"/><line x1="150" y1="194" x2="445" y2="194" stroke="#4386d8" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="194" r="5" fill="#4386d8"/><circle cx="445" cy="194" r="5" fill="#4386d8"/><text x="565" y="125" class="label">重复抽样</text><text x="565" y="155" class="small">区间有宽有窄</text></svg>
