<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-18 desc-18"><title id="title-18">从预注册到开放报告</title><desc id="desc-18">可信研究把问题、设计、数据、分析和报告连接成可核验的过程。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><g><rect x="20" y="80" width="128" height="72" rx="13" fill="#e5edff"/><text x="84" y="122" text-anchor="middle" class="label">研究问题</text><rect x="168" y="80" width="128" height="72" rx="13" fill="#dff5ec"/><text x="232" y="122" text-anchor="middle" class="label">预注册</text><rect x="316" y="80" width="128" height="72" rx="13" fill="#fff0d9"/><text x="380" y="122" text-anchor="middle" class="label">数据收集</text><rect x="464" y="80" width="128" height="72" rx="13" fill="#f2eaff"/><text x="528" y="122" text-anchor="middle" class="label">分析代码</text><rect x="612" y="80" width="128" height="72" rx="13" fill="#e5edff"/><text x="676" y="122" text-anchor="middle" class="label">完整报告</text></g><path d="M148 116 H165" stroke="#64748b" stroke-width="3"/><path d="M157 108 L166 116 L157 124" stroke="#64748b" stroke-width="3" fill="none"/><path d="M296 116 H313" stroke="#64748b" stroke-width="3"/><path d="M305 108 L314 116 L305 124" stroke="#64748b" stroke-width="3" fill="none"/><path d="M444 116 H461" stroke="#64748b" stroke-width="3"/><path d="M453 108 L462 116 L453 124" stroke="#64748b" stroke-width="3" fill="none"/><path d="M592 116 H609" stroke="#64748b" stroke-width="3"/><path d="M601 108 L610 116 L601 124" stroke="#64748b" stroke-width="3" fill="none"/><text x="380" y="205" text-anchor="middle" class="small">让分析过程可追溯、可复核、可复现</text></svg>
