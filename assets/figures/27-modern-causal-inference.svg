<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-27 desc-27"><title id="title-27">DID 比较两组的前后变化</title><desc id="desc-27">双重差分扣除共同时间变化，用处理组相对对照组的变化差估计处理效应。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><line x1="70" y1="200" x2="700" y2="200" stroke="#64748b" stroke-width="2"/><line x1="100" y1="35" x2="100" y2="200" stroke="#64748b" stroke-width="2"/><path d="M100 150 L650 80" stroke="#d38a32" stroke-width="4"/><path d="M100 170 L650 145" stroke="#4386d8" stroke-width="4"/><line x1="390" y1="30" x2="390" y2="200" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/><text x="240" y="225" text-anchor="middle" class="small">处理前</text><text x="560" y="225" text-anchor="middle" class="small">处理后</text><text x="670" y="70" class="small">处理组</text><text x="670" y="150" class="small">对照组</text></svg>
