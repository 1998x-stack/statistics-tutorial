<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-15 desc-15"><title id="title-15">分析路径越多，选择空间越大</title><desc id="desc-15">未预先约束的分析路径可能让研究者只报告最有利的结果。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><rect x="25" y="95" width="150" height="58" rx="12" fill="#e5edff"/><text x="100" y="130" text-anchor="middle" class="label">原始数据</text><path d="M175 124 H250 M250 124 L330 45 M250 124 L330 124 M250 124 L330 205" stroke="#64748b" stroke-width="3" fill="none"/><g fill="#fff0d9" stroke="#d38a32" stroke-width="2"><rect x="330" y="20" width="150" height="48" rx="10"/><rect x="330" y="100" width="150" height="48" rx="10"/><rect x="330" y="180" width="150" height="48" rx="10"/></g><g class="small" text-anchor="middle"><text x="405" y="49">删选样本</text><text x="405" y="129">换模型</text><text x="405" y="209">改窗口</text></g><path d="M480 44 L560 124 M480 124 H560 M480 204 L560 124" stroke="#64748b" stroke-width="3"/><rect x="560" y="95" width="175" height="58" rx="12" fill="#fee2e2"/><text x="647" y="130" text-anchor="middle" class="label">只报告显著结果</text></svg>
