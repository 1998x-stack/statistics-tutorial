<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-12 desc-12"><title id="title-12">功效由效应量、样本量和错误率共同决定</title><desc id="desc-12">在其他条件相同的情况下，样本量增加通常会提高检测特定效应的功效。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><path d="M55 200 C150 200 200 180 260 125 C320 70 360 45 430 38" fill="none" stroke="#4386d8" stroke-width="4"/><path d="M55 200 C150 200 240 165 320 95 C400 25 470 18 560 18" fill="none" stroke="#15966d" stroke-width="4"/><line x1="55" y1="200" x2="705" y2="200" stroke="#64748b" stroke-width="2"/><line x1="55" y1="200" x2="55" y2="18" stroke="#64748b" stroke-width="2"/><text x="380" y="235" text-anchor="middle" class="small">样本量 n 增加 → 功效通常上升</text><text x="70" y="20" class="small">Power</text></svg>
