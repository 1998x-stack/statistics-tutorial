<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-02 desc-02"><title id="title-02">四种测量尺度的信息层级</title><desc id="desc-02">名义、有序、等距、等比尺度携带的信息不同，允许的运算也不同。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><path d="M80 196 H680" stroke="#64748b" stroke-width="2"/><rect x="85" y="150" width="130" height="48" rx="10" fill="#dbeafe"/><rect x="235" y="118" width="130" height="80" rx="10" fill="#d1fae5"/><rect x="385" y="86" width="130" height="112" rx="10" fill="#fef3c7"/><rect x="535" y="54" width="130" height="144" rx="10" fill="#fce7f3"/><g class="label" text-anchor="middle"><text x="150" y="179">名义</text><text x="300" y="149">有序</text><text x="450" y="120">等距</text><text x="600" y="91">等比</text></g><text x="150" y="218" text-anchor="middle" class="small">分类</text><text x="300" y="218" text-anchor="middle" class="small">排序</text><text x="450" y="218" text-anchor="middle" class="small">间距</text><text x="600" y="218" text-anchor="middle" class="small">绝对零点</text></svg>
