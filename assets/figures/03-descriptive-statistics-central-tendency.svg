<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-03 desc-03"><title id="title-03">极端值会拉动均值</title><desc id="desc-03">同一组数据中，极端值会显著改变均值，而中位数对单个极端值更稳健。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><line x1="70" y1="200" x2="700" y2="200" stroke="#64748b" stroke-width="2"/><g fill="#8bb8f2"><rect x="90" y="155" width="30" height="45" rx="5"/><rect x="145" y="146" width="30" height="54" rx="5"/><rect x="200" y="140" width="30" height="60" rx="5"/><rect x="255" y="134" width="30" height="66" rx="5"/><rect x="310" y="125" width="30" height="75" rx="5"/><rect x="365" y="116" width="30" height="84" rx="5"/><rect x="420" y="110" width="30" height="90" rx="5"/><rect x="560" y="20" width="30" height="180" rx="5" fill="#f59e0b"/></g><line x1="240" y1="26" x2="240" y2="205" stroke="#15966d" stroke-width="4" stroke-dasharray="6 5"/><line x1="360" y1="26" x2="360" y2="205" stroke="#db7b38" stroke-width="4" stroke-dasharray="6 5"/><text x="240" y="18" text-anchor="middle" class="small">中位数</text><text x="360" y="18" text-anchor="middle" class="small">均值</text><text x="575" y="15" text-anchor="middle" class="small">极端值</text></svg>
