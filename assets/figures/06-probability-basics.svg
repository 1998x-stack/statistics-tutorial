<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-06 desc-06"><title id="title-06">阳性结果不等于患病概率</title><desc id="desc-06">贝叶斯更新把基准率、灵敏度和特异度放在同一条概率路径中。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><rect x="25" y="20" width="170" height="54" rx="12" fill="#e5edff"/><text x="110" y="53" text-anchor="middle" class="label">所有受检者</text><path d="M110 74 V105 M110 105 L300 145 M110 105 L300 45" stroke="#64748b" stroke-width="3" fill="none"/><rect x="300" y="20" width="180" height="54" rx="12" fill="#dff5ec"/><text x="390" y="53" text-anchor="middle" class="label">患病（基准率）</text><rect x="300" y="120" width="180" height="54" rx="12" fill="#fff0d9"/><text x="390" y="153" text-anchor="middle" class="label">未患病</text><path d="M480 47 H565 M480 147 H565" stroke="#64748b" stroke-width="3"/><rect x="565" y="20" width="170" height="54" rx="12" fill="#dff5ec"/><text x="650" y="53" text-anchor="middle" class="label">真阳性</text><rect x="565" y="120" width="170" height="54" rx="12" fill="#fee2e2"/><text x="650" y="153" text-anchor="middle" class="label">假阳性</text></svg>
