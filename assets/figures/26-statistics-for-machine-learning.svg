<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-26 desc-26"><title id="title-26">偏差与方差随模型复杂度变化</title><desc id="desc-26">模型太简单可能欠拟合，模型太复杂可能对训练样本波动过度敏感。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><line x1="60" y1="200" x2="710" y2="200" stroke="#64748b" stroke-width="2"/><path d="M70 30 C190 45 300 90 390 160 C470 205 570 210 700 212" fill="none" stroke="#4386d8" stroke-width="4"/><path d="M70 210 C200 205 310 175 400 120 C500 55 590 30 700 20" fill="none" stroke="#d38a32" stroke-width="4"/><path d="M70 90 C200 110 290 155 380 160 C490 165 580 120 700 75" fill="none" stroke="#15966d" stroke-width="4"/><text x="145" y="22" class="small">偏差²</text><text x="650" y="18" class="small">方差</text><text x="380" y="235" text-anchor="middle" class="small">模型复杂度增加</text></svg>
