<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-19 desc-19"><title id="title-19">多个自变量共同解释一个结果</title><desc id="desc-19">多元回归将多个预测变量放入同一模型，系数解释为控制其他变量后的条件关系。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><rect x="270" y="88" width="220" height="75" rx="15" fill="#dff5ec"/><text x="380" y="132" text-anchor="middle" class="label">结果变量 Y</text><rect x="25" y="20" width="130" height="48" rx="12" fill="#e5edff"/><text x="90" y="50" text-anchor="middle" class="label">X₁</text><path d="M90 68 L330 88" stroke="#4386d8" stroke-width="3"/><rect x="275" y="20" width="130" height="48" rx="12" fill="#e5edff"/><text x="340" y="50" text-anchor="middle" class="label">X₂</text><path d="M340 68 L380 88" stroke="#4386d8" stroke-width="3"/><rect x="525" y="20" width="130" height="48" rx="12" fill="#e5edff"/><text x="590" y="50" text-anchor="middle" class="label">X₃</text><path d="M590 68 L430 88" stroke="#4386d8" stroke-width="3"/><text x="380" y="215" text-anchor="middle" class="small">βⱼ 表示其他模型变量固定时的条件变化</text></svg>
