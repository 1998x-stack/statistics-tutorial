<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-08 desc-08"><title id="title-08">统计量也有自己的分布</title><desc id="desc-08">重复抽样会形成样本均值的分布，它比单个观测值更集中。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><path d="M35 190 C85 190 110 30 180 30 C250 30 275 190 330 190" fill="none" stroke="#4386d8" stroke-width="4"/><path d="M410 190 C490 190 520 80 585 80 C650 80 680 190 735 190" fill="none" stroke="#15966d" stroke-width="4"/><line x1="35" y1="190" x2="330" y2="190" stroke="#64748b" stroke-width="2"/><line x1="410" y1="190" x2="735" y2="190" stroke="#64748b" stroke-width="2"/><text x="180" y="225" text-anchor="middle" class="small">原始观测分布</text><text x="585" y="225" text-anchor="middle" class="small">样本均值分布</text></svg>
