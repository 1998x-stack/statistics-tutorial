<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-17 desc-17"><title id="title-17">混杂变量打开非因果路径</title><desc id="desc-17">共同原因 Z 同时影响处理 X 与结果 Y，可能制造 X 与 Y 的表面关联。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><circle cx="135" cy="125" r="42" fill="#fff0d9" stroke="#d38a32" stroke-width="3"/><circle cx="380" cy="125" r="42" fill="#e5edff" stroke="#4386d8" stroke-width="3"/><circle cx="625" cy="125" r="42" fill="#dff5ec" stroke="#15966d" stroke-width="3"/><text x="135" y="132" text-anchor="middle" class="label">Z</text><text x="380" y="132" text-anchor="middle" class="label">X</text><text x="625" y="132" text-anchor="middle" class="label">Y</text><path d="M177 112 L337 112 M177 138 L582 138 M422 125 H583" stroke="#64748b" stroke-width="3" fill="none"/><path d="M327 103 L340 112 L327 121 M572 129 L585 138 L572 147 M572 116 L585 125 L572 134" stroke="#64748b" stroke-width="3" fill="none"/><text x="380" y="210" text-anchor="middle" class="small">共同原因形成后门路径；调整策略取决于因果图</text></svg>
