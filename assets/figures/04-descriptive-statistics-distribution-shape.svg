<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-04 desc-04"><title id="title-04">用箱线图读懂分布</title><desc id="desc-04">箱线图用四分位数、须和离群点概括分布位置与离散程度。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><line x1="90" y1="128" x2="670" y2="128" stroke="#64748b" stroke-width="3"/><line x1="145" y1="93" x2="145" y2="163" stroke="#64748b" stroke-width="3"/><line x1="610" y1="93" x2="610" y2="163" stroke="#64748b" stroke-width="3"/><rect x="145" y="78" width="465" height="100" rx="10" fill="#dceafe" stroke="#467ac4" stroke-width="3"/><line x1="390" y1="78" x2="390" y2="178" stroke="#db7b38" stroke-width="5"/><circle cx="700" cy="128" r="9" fill="#e58b35"/><text x="145" y="205" text-anchor="middle" class="small">Q1</text><text x="390" y="205" text-anchor="middle" class="small">中位数</text><text x="610" y="205" text-anchor="middle" class="small">Q3</text><text x="700" y="158" text-anchor="middle" class="small">离群点</text></svg>
