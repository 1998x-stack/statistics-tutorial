<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-28 desc-28"><title id="title-28">从问题到可辩护结论的完整链路</title><desc id="desc-28">研究项目需要把问题、设计、数据、分析和报告串联起来，并在每一步记录局限。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><g><rect x="10" y="75" width="108" height="75" rx="12" fill="#e5edff"/><text x="64" y="118" text-anchor="middle" class="label">问题</text><rect x="134" y="75" width="108" height="75" rx="12" fill="#dff5ec"/><text x="188" y="118" text-anchor="middle" class="label">设计</text><rect x="258" y="75" width="108" height="75" rx="12" fill="#fff0d9"/><text x="312" y="118" text-anchor="middle" class="label">数据</text><rect x="382" y="75" width="108" height="75" rx="12" fill="#f2eaff"/><text x="436" y="118" text-anchor="middle" class="label">分析</text><rect x="506" y="75" width="108" height="75" rx="12" fill="#e5edff"/><text x="560" y="118" text-anchor="middle" class="label">诊断</text><rect x="630" y="75" width="108" height="75" rx="12" fill="#dff5ec"/><text x="684" y="118" text-anchor="middle" class="label">报告</text></g><path d="M118 112 H132" stroke="#64748b" stroke-width="3"/><path d="M124 104 L133 112 L124 120" stroke="#64748b" stroke-width="3" fill="none"/><path d="M118 112 H256" stroke="#64748b" stroke-width="3"/><path d="M248 104 L257 112 L248 120" stroke="#64748b" stroke-width="3" fill="none"/><path d="M118 112 H380" stroke="#64748b" stroke-width="3"/><path d="M372 104 L381 112 L372 120" stroke="#64748b" stroke-width="3" fill="none"/><path d="M118 112 H504" stroke="#64748b" stroke-width="3"/><path d="M496 104 L505 112 L496 120" stroke="#64748b" stroke-width="3" fill="none"/><path d="M118 112 H628" stroke="#64748b" stroke-width="3"/><path d="M620 104 L629 112 L620 120" stroke="#64748b" stroke-width="3" fill="none"/><text x="380" y="