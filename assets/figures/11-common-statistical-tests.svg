<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title-11 desc-11"><title id="title-11">检验选择从研究设计开始</title><desc id="desc-11">均值、比例和分类变量对应不同检验；配对关系与组数会改变选择。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243448}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#53677d}</style><rect width="760" height="250" rx="20" fill="#fbfdff"/><rect x="275" y="12" width="210" height="46" rx="12" fill="#e5edff"/><text x="380" y="41" text-anchor="middle" class="label">研究问题与变量</text><path d="M380 58 V82 M380 82 H130 V112 M380 82 V112 M380 82 H630 V112" fill="none" stroke="#64748b" stroke-width="3"/><rect x="35" y="112" width="190" height="65" rx="12" fill="#dff5ec"/><text x="130" y="140" text-anchor="middle" class="label">均值差异</text><text x="130" y="162" text-anchor="middle" class="small">t / ANOVA</text><rect x="285" y="112" width="190" height="65" rx="12" fill="#fff0d9"/><text x="380" y="140" text-anchor="middle" class="label">比例 / 频数</text><text x="380" y="162" text-anchor="middle" class="small">z / χ² / 精确检验</text><rect x="535" y="112" width="190" height="65" rx="12" fill="#f2eaff"/><text x="630" y="140" text-anchor="middle" class="label">关联 / 预测</text><text x="630" y="162" text-anchor="middle" class="small">相关 / 回归</text></svg>
